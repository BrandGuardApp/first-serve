name: Build edition

on:
  schedule:
    # GitHub often starts scheduled runs late or skips them, so check every hour.
    # A run builds the edition that's due (morning from 6 AM PT, evening from 5 PM PT)
    # and exits in seconds if it's already published.
    - cron: "7 * * * *"
  repository_dispatch:
    # Lets an outside scheduler (e.g. cron-job.org) trigger a run on time.
    types: [edition]
  workflow_dispatch:
    inputs:
      slot:
        description: "Which edition to build (auto = whichever is due)"
        type: choice
        options: [auto, morning, evening]
        default: auto
      skip_email:
        description: "Skip the email"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          # Optional paid fallback: set LLM_PROVIDER=claude and add ANTHROPIC_API_KEY.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FORCE_SLOT: ${{ inputs.slot != 'auto' && inputs.slot || '' }}
          SKIP_EMAIL: ${{ inputs.skip_email && '1' || '' }}
        run: node scripts/edition.mjs

      - name: Publish edition
        # Runs even if the email step failed, so the site still updates.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "first-serve-bot"
          git config user.email "first-serve-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new edition."
          else
            git commit -m "Edition $(jq -r .id data/latest.json)"
            git push
          fi
